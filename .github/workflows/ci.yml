name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BangumiTracker.xcodeproj \
            -scheme BangumiTracker

      - name: Ensure simulator
        run: |
          # macOS 26 runner images install runtimes but don't pre-create the
          # device; create + boot it so the name-based destinations resolve.
          xcrun simctl create "iPhone 17 Pro" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro" \
            "com.apple.CoreSimulator.SimRuntime.iOS-26-5" >/dev/null 2>&1 || true
          xcrun simctl boot "iPhone 17 Pro" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "iPhone 17 Pro" -b

      - name: Build
        run: |
          xcodebuild build \
            -project BangumiTracker.xcodeproj \
            -scheme BangumiTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project BangumiTracker.xcodeproj \
            -scheme BangumiTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BangumiTrackerTests

      - name: SwiftLint
        run: |
          swiftlint --strict
