name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BangumiTracker.xcodeproj \
            -scheme BangumiTracker

      - name: Ensure simulator
        run: |
          # The image pre-creates "iPhone 17 Pro" but CoreSimulator hasn't
          # registered it for xcodebuild until a simctl call runs. Create only
          # if missing (never duplicate), boot, and pass the UDID to
          # destinations so a name collision can't make matching ambiguous.
          if ! xcrun simctl list devices | grep -q 'iPhone 17 Pro'; then
            xcrun simctl create "iPhone 17 Pro" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro" \
              "com.apple.CoreSimulator.SimRuntime.iOS-26-5" >/dev/null
          fi
          UDID=$(xcrun simctl list devices | grep 'iPhone 17 Pro' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Prepare DevSecrets
        # DevSecrets.swift is gitignored (real tokens exist only locally); the
        # tracked example has empty values that compile and disable OAuth /
        # feedback gracefully, which is all tests need.
        run: cp BangumiTracker/DevSecrets.swift.example BangumiTracker/DevSecrets.swift

      - name: Build
        run: |
          xcodebuild build \
            -project BangumiTracker.xcodeproj \
            -scheme BangumiTracker \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project BangumiTracker.xcodeproj \
            -scheme BangumiTracker \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BangumiTrackerTests

      - name: SwiftLint
        run: |
          swiftlint --strict
