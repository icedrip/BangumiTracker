# BangumiTracker SwiftLint rules
disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_name
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - trailing_comma  # SE-0253 recommends trailing commas; the codebase uses them
  - nesting
  - implicit_optional_initialization  # codebase uses explicit `= nil` throughout
  - multiple_closures_with_trailing_closure  # Button(action:) { label } is idiomatic SwiftUI

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - closure_spacing
  - convenience_type
  - sorted_first_last
  - yoda_condition

included:
  - BangumiTracker
  - BangumiWidgets

excluded:
  - build
  - BangumiTracker.xcodeproj
  - BangumiWidgets-Info.plist
